# Weekly database backup, encrypted, kept for 90 days as a workflow artifact.
# Free Supabase projects have no backups of their own, so this is the safety net.
# Setup: Settings → Secrets and variables → Actions → Secrets:
#   DIRECT_URL         the Supabase *Session pooler* connection string (port 5432)
#   BACKUP_PASSPHRASE  a long passphrase — keep it somewhere safe; it's needed to restore
# Restore steps are in docs/DEPLOYMENT.md ("Backups").
name: Weekly database backup

on:
  schedule:
    - cron: "30 20 * * 6" # Sundays, 02:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DIRECT_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Add the DIRECT_URL and BACKUP_PASSPHRASE secrets to enable backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the PostgreSQL 17 client
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17

      - name: Dump and encrypt
        if: steps.config.outputs.ready == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          file="aayat-al-ruh-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DIRECT_URL" --schema=public --no-owner --no-privileges --format=custom --file="$file"
          # Encrypted before upload: artifacts can be downloaded by anyone who can read the repository
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" --output "$file.gpg" "$file"
          rm "$file"
          ls -lh "$file.gpg"

      - name: Keep the backup for 90 days
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: "*.dump.gpg"
          retention-days: 90
